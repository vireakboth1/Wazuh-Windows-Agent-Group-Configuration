<!-- ============================================================
     Wazuh Agent Group Configuration – windows-general
     Balanced Monitoring Profile for General Windows Endpoints
     Document Version : 1.0
     Wazuh Version    : 4.8+ (tested on 4.12–4.14)
     Deploy path      : /var/ossec/etc/shared/windows-general/agent.conf
     ============================================================ -->
<agent_config os="Windows">

  <!-- ============================================================
       1. CLIENT BUFFER
       Prevents buffer overflow during event bursts (patching,
       logon storms). 250 EPS is safe for 4–16 GB RAM endpoints.
       ============================================================ -->
  <client_buffer>
    <queue_size>5000</queue_size>
    <events_per_second>250</events_per_second>
  </client_buffer>


  <!-- ============================================================
       2. EVENT LOG MONITORING
       All channels use eventchannel format with XPath queries to
       collect only high-value events and reduce noise.
       ============================================================ -->

  <!-- 2.1 Sysmon – Process, Network, Image Load, File/Reg, DNS
       PREREQUISITE: Microsoft Sysinternals Sysmon must be installed
       and configured on each endpoint before this channel produces
       events. Deploy Sysmon separately (e.g., via GPO or endpoint
       management tooling) with an appropriate sysmonconfig.xml.
       EventID 1  = Process Create
       EventID 3  = Network Connection
       EventID 7  = Image Loaded
       EventID 11 = File Created
       EventID 12 = Registry Object Added/Deleted
       EventID 13 = Registry Value Set
       EventID 22 = DNS Query
       Excludes noisy IDs (8/10/23) unless ransomware focus needed. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1 or EventID=3 or EventID=7 or EventID=11 or EventID=12 or EventID=13 or EventID=22]</query>
    <only_future_events>yes</only_future_events>
  </localfile>

  <!-- 2.2 Application – Warnings, Errors, and Critical events
       Level 1 = Critical, Level 2 = Error, Level 3 = Warning
       Level 4 (Informational) and Level 5 (Verbose) are excluded
       because they generate high volume with low detection value. -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Level&lt;=3]</query>
  </localfile>

  <!-- 2.3 Security – Auth, Privilege, Account Mgmt, Policy Changes
       4624  = Successful Logon
       4625  = Failed Logon
       4648  = Logon Using Explicit Credentials
       4672  = Special Privileges Assigned to New Logon
       4697  = Service Installation
       4698  = Scheduled Task Created
       4720  = User Account Created
       4722  = User Account Enabled
       4723  = Password Change Attempted
       4724  = Password Reset Attempted
       4725  = User Account Disabled
       4726  = User Account Deleted
       4732  = Member Added to Security-Enabled Local Group
       4733  = Member Removed from Security-Enabled Local Group
       4740  = User Account Locked Out
       4756  = Member Added to Universal Security Group
       1102  = Audit Log Cleared
       5140  = Network Share Object Accessed
       4719  = System Audit Policy Changed
       6416  = New External Device Recognised by the System
       4663  = Attempt to Access Object
       4768  = Kerberos TGT Requested
       4769  = Kerberos Service Ticket Requested
       4776  = NTLM Authentication Attempt -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4648 or EventID=4672 or EventID=4697 or EventID=4698 or EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4732 or EventID=4733 or EventID=4740 or EventID=4756 or EventID=1102 or EventID=5140 or EventID=4719 or EventID=6416 or EventID=4663 or EventID=4768 or EventID=4769 or EventID=4776]</query>
    <only_future_events>yes</only_future_events>
  </localfile>

  <!-- 2.4 System – Critical/Error levels + key service/boot events
       7022  = Service Hung on Starting
       7023  = Service Terminated with Error
       7024  = Service Terminated with Service-Specific Error
       7031  = Service Terminated Unexpectedly
       7034  = Service Terminated Unexpectedly (auto-restart)
       1074  = System Shutdown/Restart Initiated
       6005  = Event Log Service Started (system boot)
       6006  = Event Log Service Stopped (system shutdown)
       6007  = Unexpected system shutdown detected
       6008  = Unexpected system shutdown (previous dirty)
       104   = System Log Cleared -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[(Level=1 or Level=2) or (EventID=7022 or EventID=7023 or EventID=7024 or EventID=7031 or EventID=7034 or EventID=1074 or EventID=6005 or EventID=6006 or EventID=6007 or EventID=6008 or EventID=104)]</query>
  </localfile>

  <!-- 2.5 Windows Defender – Detections, Quarantines, AV State
       1116  = Malware Detected
       1117  = Malware Action Taken
       1118  = Malware Action Failed
       1119  = Malware Remediation Succeeded
       1121  = Attack Surface Reduction Rule Triggered (Block)
       1122  = Attack Surface Reduction Rule Triggered (Audit)
       1123  = Attack Surface Reduction Rule Bypassed
       1124  = Attack Surface Reduction Audit Event
       5000  = Antivirus Enabled
       5001  = Antivirus Disabled (tampering alert) -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=1116 or EventID=1117 or EventID=1118 or EventID=1119 or EventID=1121 or EventID=1122 or EventID=1123 or EventID=1124 or EventID=5000 or EventID=5001]</query>
  </localfile>

  <!-- 2.6 PowerShell – Module Logging + Script Block Execution
       4103  = Module Logging (pipeline execution details)
       4105  = Script Block Logging – Script Block Started
       4106  = Script Block Logging – Script Block Completed -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4103 or EventID=4105 or EventID=4106]</query>
    <only_future_events>yes</only_future_events>
  </localfile>

  <!-- 2.7 Task Scheduler – Persistence via Scheduled Tasks
       100   = Task Started
       102   = Task Completed
       106   = Task Registered
       140   = Task Updated
       141   = Task Deleted
       200   = Task Action Started
       201   = Task Action Completed -->
  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=100 or EventID=102 or EventID=106 or EventID=140 or EventID=141 or EventID=200 or EventID=201]</query>
  </localfile>

  <!-- 2.8 Windows Firewall – Rule and Profile Tampering
       2003  = Firewall Rule Added
       2004  = Firewall Rule Modified
       2005  = Firewall Rule Deleted
       2006  = Firewall Setting Changed
       2009  = Firewall Profile Changed -->
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=2003 or EventID=2004 or EventID=2005 or EventID=2006 or EventID=2009]</query>
  </localfile>

  <!-- 2.9 WMI Activity – Malicious WMI Persistence/Execution
       5859  = WMI Activity – Consumer Activity
       5860  = WMI Activity – Temporary Consumer Created
       5861  = WMI Activity – Permanent Consumer Created/Modified -->
  <localfile>
    <location>Microsoft-Windows-WMI-Activity/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=5859 or EventID=5860 or EventID=5861]</query>
  </localfile>

  <!-- 2.10 DNS Client – C2 / Suspicious Name Resolution
       3006  = DNS Query Failed
       3007  = DNS Query Resolved (success)
       3008  = DNS Query Result: No Records Found -->
  <localfile>
    <location>Microsoft-Windows-DNS-Client/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=3006 or EventID=3007 or EventID=3008]</query>
    <only_future_events>yes</only_future_events>
  </localfile>

  <!-- 2.11 Driver Frameworks (User Mode) – Removable Media Threats
       2003  = USB Device Connected
       2100  = Device Connect
       2102  = Device Disconnect
       2105  = Device Surprise Removal -->
  <localfile>
    <location>Microsoft-Windows-DriverFrameworks-UserMode/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=2003 or EventID=2100 or EventID=2102 or EventID=2105]</query>
  </localfile>

  <!-- 2.12 Active Response Log – Agent-triggered Response Visibility -->
  <localfile>
    <location>active-responses.log</location>
    <log_format>syslog</log_format>
  </localfile>


  <!-- ============================================================
       3. ROOTCHECK
       Uses shared Windows malware/apps lists for basic
       policy/malware scanning.
       ============================================================ -->
  <rootcheck>
    <enabled>yes</enabled>
    <windows_apps>./shared/win_applications_rcl.txt</windows_apps>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>


  <!-- ============================================================
       4. SECURITY CONFIGURATION ASSESSMENT (SCA)
       24-hour scan interval + scan on agent start to detect CIS
       benchmark drift with reduced performance overhead.
       ============================================================ -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>24h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>


  <!-- ============================================================
       5. FILE INTEGRITY MONITORING (SYSCHECK / FIM)
       Daily full scan (86400s) + realtime monitoring on paths with
       high risk of malicious writes. whodata enables attribution
       (who changed what) via Windows Audit/SACLs.
       Avoid whodata on large directories (e.g., C:\) to prevent
       performance impact.
       ============================================================ -->
  <syscheck>
    <enabled>yes</enabled>

    <!-- Full scan frequency: once per day -->
    <frequency>86400</frequency>

    <!-- Scan on agent start to detect changes made while offline -->
    <scan_on_start>yes</scan_on_start>

    <!-- Alert on files deleted during the scan -->
    <alert_new_files>yes</alert_new_files>

    <!-- Disabled: auto_ignore is intentionally set to "no" so that
         every detected change is alerted regardless of how often a
         file changes. Security monitoring must not silently suppress
         repeated modifications (e.g., malware overwriting a file). -->
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- ── Realtime + Who-data monitored directories ─────────── -->

    <!-- Downloads: only high-risk extensions (executables, scripts) -->
    <directories realtime="yes" whodata="yes"
                 report_changes="no"
                 restrict=".exe,.dll,.ps1,.bat,.cmd,.vbs,.js,.msi,.scr,.com,.pif">
      %USERPROFILE%\Downloads
    </directories>

    <!-- Documents: full monitoring for data-theft detection -->
    <directories realtime="yes" whodata="yes" report_changes="no">
      %USERPROFILE%\Documents
    </directories>

    <!-- User Temp: executables and scripts dropped by malware -->
    <directories realtime="yes" whodata="yes"
                 report_changes="no"
                 restrict=".exe,.dll,.ps1,.bat,.cmd,.vbs,.js,.msi,.scr,.com,.pif">
      %TEMP%
    </directories>

    <!-- System Temp (for all users) -->
    <directories realtime="yes" whodata="yes"
                 report_changes="no"
                 restrict=".exe,.dll,.ps1,.bat,.cmd,.vbs,.js,.msi,.scr,.com,.pif">
      C:\Windows\Temp
    </directories>

    <!-- Startup folder: persistence via auto-start entries -->
    <directories realtime="yes" whodata="yes" report_changes="yes">
      C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup
    </directories>

    <!-- User-specific Startup folder -->
    <directories realtime="yes" whodata="yes" report_changes="yes">
      %USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup
    </directories>

    <!-- ── Standard (non-realtime) monitored directories ──────── -->

    <!-- System32 executables and DLLs (change-based detection) -->
    <directories check_all="yes" report_changes="no">
      C:\Windows\System32
    </directories>

    <!-- SysWOW64 (32-bit subsystem on 64-bit Windows) -->
    <directories check_all="yes" report_changes="no">
      C:\Windows\SysWOW64
    </directories>

    <!-- ── Noise-reduction: ignore patterns ───────────────────── -->

    <!-- Browser caches and profiles (high churn, low signal) -->
    <ignore>C:\Users\*\AppData\Local\Google\Chrome\User Data\Default\Cache</ignore>
    <ignore>C:\Users\*\AppData\Local\Mozilla\Firefox\Profiles</ignore>
    <ignore>C:\Users\*\AppData\Local\Microsoft\Edge\User Data\Default\Cache</ignore>

    <!-- Windows Update and installer temps -->
    <ignore>C:\Windows\SoftwareDistribution\Download</ignore>
    <ignore>C:\Windows\Installer</ignore>

    <!-- Log files (monitored separately via localfile) -->
    <ignore type="sregex">\.log$</ignore>
    <ignore type="sregex">\.etl$</ignore>
    <ignore type="sregex">\.evtx$</ignore>

    <!-- Thumbnail and index databases -->
    <ignore type="sregex">thumbs\.db$</ignore>
    <ignore type="sregex">\.db-shm$</ignore>
    <ignore type="sregex">\.db-wal$</ignore>

    <!-- Recycle Bin -->
    <ignore>C:\$Recycle.Bin</ignore>

    <!-- Prefetch files (high churn, low attribution value) -->
    <ignore>C:\Windows\Prefetch</ignore>

    <!-- Windows Defender scan history (high churn) -->
    <ignore>C:\ProgramData\Microsoft\Windows Defender\Scans\History</ignore>

    <!-- ── Registry monitoring: persistence-focused ───────────── -->

    <!-- Current user Run/RunOnce (per-user persistence) -->
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>

    <!-- Local machine Run/RunOnce (system-wide persistence) -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>

    <!-- Shell folders (hijackable for persistence) -->
    <windows_registry>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders</windows_registry>

    <!-- Active Setup (persistence across user logons) -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Active Setup\Installed Components</windows_registry>

    <!-- Winlogon keys (credential and session hijacking) -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>

    <!-- AppInit_DLLs (DLL injection persistence) -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Windows</windows_registry>

    <!-- Image File Execution Options (debugger hijacking / IFEO) -->
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</windows_registry>

    <!-- ── Registry ignore: high-noise, low-signal keys ──────── -->

    <!-- Service control manager entries (legitimate high churn) -->
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\MpsSvc</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\WinDefend</registry_ignore>

    <!-- USB/removable device history (forensic but very noisy) -->
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Enum\USBSTOR</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Enum\USB</registry_ignore>

    <!-- Software usage MRU lists (high churn, low threat signal) -->
    <registry_ignore>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RecentDocs</registry_ignore>
    <registry_ignore>HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\ComDlg32\OpenSavePidlMRU</registry_ignore>

  </syscheck>

</agent_config>
